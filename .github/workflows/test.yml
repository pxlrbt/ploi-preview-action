name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/test.sh
      - name: Check the syntax of every script
        run: |
          for script in setup.sh scripts/*.sh scripts/lib/*.sh; do
            bash -n "$script"
          done
